<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}epaData System{% endblock %}</title>

    <!-- Bootstrap 5 CSS: Pre-made professional styles so our app looks clean -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Intro.js CSS: This styles the tutorial highlight boxes and popup text -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/introjs.min.css" rel="stylesheet">

    <style>
        /* EPA inspired color scheme */
        :root {
            --epa-green: #2b5c46;
            --epa-dark: #1e293b;
        }

        /* Custom styling to keep the site looking like an official scientific tool */
        .navbar-custom {
            background-color: var(--epa-dark);
            border-bottom: 3px solid var(--epa-green);
        }

        /* Monospace font for IDs and numbers so digits line up neatly */
        .mono-num {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }
    </style>
</head>
<body class="bg-light">

    <!-- MASTER NAVIGATION BAR: This appears at the top of EVERY single page -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/">
                <!-- Simple leaf/factory logo icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-shield-check me-2" viewBox="0 0 16 16">
                    <path d="M5.338 1.59a61 61 0 0 0-2.837.856.48.48 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.7 10.7 0 0 0 2.287 2.233c.346.244.652.42.893.533q.18.085.293.134a.47.47 0 0 0 .155.038.47.47 0 0 0 .155-.038q.113-.049.293-.134a10.7 10.7 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067s-1.552.223-2.662.524z"/>
                    <path d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0"/>
                </svg>
                epaData
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item" 
                        data-bs-toggle="tooltip" title="View the main search dashboard." 
                        data-intro="Navigation: Click here to return to the main Data Explorer." data-step="98">
                        <a class="nav-link" href="/">Home / Explorer</a>
                    </li>
                    <li class="nav-item" 
                        data-bs-toggle="tooltip" title="Import new EPA files." 
                        data-intro="Navigation: Click here to upload new CSV/Excel datasets to the SQLite database." data-step="99">
                        <a class="nav-link" href="/upload">Upload Datasets</a>
                    </li>
                </ul>
                
                <!-- Tutorial Button: Clicking this starts the step-by-step walkthrough -->
                 <button class="btn btn-warning btn-sm fw-bold me-3" type="button" onclick="introJs().setOption('exitOnOverlayClick', false).start()">
                Start Tutorial
                </button>

                <!-- Small status badge showing database connection mode -->
                <span class="badge bg-secondary mono-num">Phase 1: SQLite Storage</span>
            </div>
        </div>
    </nav>

    <!-- THE PLUG-IN SLOT: Jinja puts the unique content of each page right here -->
    <div class="container-fluid px-4 pb-5">
        {% block content %}
        <!-- Child pages inject their HTML inside here -->
        {% endblock %}
    </div>

    <!-- Bootstrap Javascript bundle for dropdown menus and buttons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Intro.js Script for the tutorial functionality -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/intro.js"></script>

    <!-- Custom script to turn on Bootstrap hover tooltips across the entire website -->
    <script>
    document.addEventListener("DOMContentLoaded", function(){
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    });
    </script>
</body>
</html>
